name: Nightly full tests

# 병합 후 전체 테스트(build-windows.yml의 tests job)를 제거한 대신, 회귀를 잡는 안전망으로
# main 전체 EditMode+PlayMode를 여기서 유지한다.
#
# 기본은 수동 실행(workflow_dispatch)이며, 야간 스케줄은 아래 schedule 주석을 풀어 켠다.
# self-hosted 러너가 1대이므로 스케줄을 켤 경우 다른 CI와 겹치지 않는 시간대를 고른다.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 18 * * *'  # 매일 03:00 KST (UTC 18:00)

concurrency:
  group: nightly-full-tests
  cancel-in-progress: true

jobs:
  tests:
    name: Full EditMode + PlayMode on main
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          lfs: true
          clean: true

      - name: Run EditMode + PlayMode tests
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\run-unity-tests.ps1" all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
