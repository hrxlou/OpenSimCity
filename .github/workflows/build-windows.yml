name: Build Windows

# main 병합 또는 태그(v*) push 시 Windows Standalone 빌드를 만들고 artifact로 보관한다.
# 태그(v*)는 릴리스 후보로 별도 보관한다.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('build-tag-{0}', github.ref_name) || 'build-main' }}
  cancel-in-progress: true

jobs:
  build:
    name: StandaloneWindows64
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          clean: true

      - name: Build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\build-windows.ps1" -OutputPath "%GITHUB_WORKSPACE%\build\StandaloneWindows64\OpenSimCity.exe"

      - name: Launch built player smoke
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\StandaloneWindows64\OpenSimCity.exe'
          $logDir = Join-Path $env:GITHUB_WORKSPACE 'TestResults'
          $log = Join-Path $logDir 'player-smoke.log'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          if (-not (Test-Path $exe)) { throw "Built player is missing: $exe" }
          if (Test-Path $log) { Remove-Item $log -Force }

          $process = Start-Process -FilePath $exe -ArgumentList @('-batchmode','-nographics','-logFile', $log) -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 250 }
              throw "Built player exited during startup smoke with code $($process.ExitCode)."
            }
            Write-Host "Built player exited cleanly during startup smoke."
          } else {
            Stop-Process -Id $process.Id -Force
            Write-Host "Built player stayed alive for the 15-second startup smoke and was stopped by CI."
          }

          if (Test-Path $log) {
            Write-Host '--- player smoke log tail ---'
            Get-Content $log -Tail 250
            Write-Host '--- end player smoke log tail ---'
            $fatal = Select-String -Path $log -Pattern 'Crash!!!|PlayerConnection.*failed|Failed to load|NullReferenceException|MissingReferenceException' -SimpleMatch:$false
            if ($fatal) {
              throw "Player startup log contains a fatal/error signature: $($fatal[0].Line)"
            }
          } else {
            throw "Player smoke did not create a log file: $log"
          }

      - name: Print release build evidence
        if: always()
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'TestResults\build-windows.release-evidence.json'
          $result = Join-Path $env:GITHUB_WORKSPACE 'TestResults\build-windows.result'
          if (Test-Path $result) { Write-Host "BUILD_RESULT=$(Get-Content $result -TotalCount 1)" }
          if (Test-Path $evidence) {
            Write-Host 'RELEASE_EVIDENCE_BEGIN'
            Get-Content $evidence
            Write-Host 'RELEASE_EVIDENCE_END'
          }

      # Artifact storage can be unavailable because of account quota. A quota failure must
      # not rewrite a successful compile/build/player-smoke result into a false build failure;
      # release evidence is always printed above and remains visible in the Actions log.
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: OpenSimCity-Windows-${{ github.sha }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14

      - name: Upload release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: OpenSimCity-Windows-${{ github.ref_name }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 90
