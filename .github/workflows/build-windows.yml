name: Build Windows

# main 병합 또는 태그(v*) push 시 Windows Standalone 빌드를 만들고 artifact로 보관한다.
# 태그(v*)는 릴리스 후보로 별도 보관한다.
#
# 같은 SHA의 EditMode/PlayMode 테스트는 이미 병합 전 PR CI(ci.yml)에서 검증되므로,
# 병합 후 전체 테스트를 다시 돌리지 않고 빌드만 수행한다(중복 제거). 빌드는 전체 컴파일을
# 포함하므로 병합 결과의 컴파일·통합 검증 역할을 겸한다. 전체 회귀 테스트는 nightly.yml의
# 수동/야간 실행으로 유지한다.
#   ※ PR CI는 main+브랜치 병합 커밋을 검증하므로, 병합 전 브랜치를 최신 main으로 맞추도록
#     저장소 브랜치 보호에서 "Require branches to be up to date before merging"을 켜는 것을
#     권장한다. 이게 병합 후 테스트 제거의 안전망이다.
#
# 초기 CD는 "빌드를 자동으로 만들어 다운로드 가능하게 보관"하는 수준까지만 다룬다.
# Steam/itch.io 업로드, 코드 서명, 자동 릴리스는 MVP 안정화 이후에 붙인다.
#
# Unity Personal 라이선스는 GitHub 호스팅 러너(UNITY_LICENSE Secret) 방식을 더 이상
# 지원하지 않아, 이미 라이선스가 활성화된 이 저장소 소유자의 Windows PC를 self-hosted
# 러너로 등록해 그 위에서 직접 빌드한다. ci.yml과 동일한 러너를 사용한다.
on:
  push:
    branches: [main]
    tags: ['v*']

# main 빌드는 최신 커밋만 남기고 대기/진행 중인 이전 빌드를 취소한다(그룹 공유).
# 태그 빌드는 릴리스마다 ref별 고유 그룹을 써서 서로 취소하지 않는다.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('build-tag-{0}', github.ref_name) || 'build-main' }}
  cancel-in-progress: true

jobs:
  build:
    name: StandaloneWindows64
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          clean: true

      # 로컬 Tools/CI/build-windows.ps1과 동일한 진입점
      # (OpenSimCity.Editor.BuildScript.PerformWindowsBuild)을 사용해 재현성을 보장한다.
      # 러너의 시스템 전역 실행 정책(Restricted)을 바꾸지 않도록, 이 프로세스에만
      # -ExecutionPolicy Bypass를 적용해 스크립트를 실행한다.
      - name: Build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\build-windows.ps1" -OutputPath "%GITHUB_WORKSPACE%\build\StandaloneWindows64\OpenSimCity.exe"

      # main 빌드: 상시 보관, 14일 유지
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v7
        with:
          name: OpenSimCity-Windows-${{ github.sha }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14

      # 태그 빌드: 릴리스 후보, 90일 유지
      - name: Upload release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: OpenSimCity-Windows-${{ github.ref_name }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 90
