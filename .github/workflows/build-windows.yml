name: Build Windows

# main 병합 시 Windows Standalone 빌드를 만들고 artifact로 보관한다.
# 태그(v*) push 시에는 릴리스 후보로 별도 보관한다.
# 초기 CD는 "빌드를 자동으로 만들어 다운로드 가능하게 보관"하는 수준까지만 다룬다.
# Steam/itch.io 업로드, 코드 서명, 자동 릴리스는 MVP 안정화 이후에 붙인다.
#
# Unity Personal 라이선스는 GitHub 호스팅 러너(UNITY_LICENSE Secret) 방식을 더 이상
# 지원하지 않아, 이미 라이선스가 활성화된 이 저장소 소유자의 Windows PC를 self-hosted
# 러너로 등록해 그 위에서 직접 빌드한다. ci.yml과 동일한 러너를 사용한다.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Unity tests for build SHA
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: true

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/*.asset', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run EditMode + PlayMode tests
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\run-unity-tests.ps1" all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-sha-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn

  build:
    name: StandaloneWindows64
    needs: tests
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: true

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/*.asset', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ github.ref_name }}-

      # 로컬 Tools/CI/build-windows.ps1과 동일한 진입점
      # (OpenSimCity.Editor.BuildScript.PerformWindowsBuild)을 사용해 재현성을 보장한다.
      # 러너의 시스템 전역 실행 정책(Restricted)을 바꾸지 않도록, 이 프로세스에만
      # -ExecutionPolicy Bypass를 적용해 스크립트를 실행한다.
      - name: Build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\build-windows.ps1" -OutputPath "%GITHUB_WORKSPACE%\build\StandaloneWindows64\OpenSimCity.exe"

      # main 빌드: 상시 보관, 14일 유지
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimCity-Windows-${{ github.sha }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14

      # 태그 빌드: 릴리스 후보, 90일 유지
      - name: Upload release candidate
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimCity-Windows-${{ github.ref_name }}
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 90
