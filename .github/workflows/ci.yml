name: CI

# main을 대상으로 하는 Pull Request에서만 EditMode/PlayMode 전체 테스트를 실행한다.
#
# 예전에는 모든 기능 브랜치 push마다 실행했으나, self-hosted 러너가 1대라 아직 PR이
# 없는 WIP 브랜치 push나 stacked 중간 merge까지 전부 러너에 순차로 쌓였다. push 트리거를
# 제거하고 pull_request(대상 main)만 트리거해, 실제로 병합을 목표로 하는 커밋만 검증한다.
# push와 pull_request를 함께 두면 같은 커밋을 두 번 돌리므로 여기서는 pull_request만 쓴다.
#
# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다(concurrency). draft PR은 건너뛰고,
# Ready for review로 전환하면 ready_for_review 이벤트로 다시 실행된다.
#
# Unity Personal 라이선스는 GitHub 호스팅 러너(UNITY_LICENSE Secret) 방식을 더 이상
# 지원하지 않아, 이미 라이선스가 활성화된 저장소 소유자의 Windows PC를 self-hosted
# 러너로 등록해 그 위에서 직접 Unity를 실행한다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unity tests
    # draft PR에서는 돌리지 않는다. Ready로 전환하면 위 ready_for_review로 재실행된다.
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 70
    steps:
      # 취소된 Unity batchmode가 Bee 응답 파일을 잡고 있으면 actions/checkout의 workspace
      # 정리가 EBUSY로 실패한다. 저장소 전용 self-hosted 러너이므로 프로젝트 관련 Unity
      # 프로세스를 먼저 종료하고 생성 캐시의 잠금 다발만 retry로 제거한다.
      - name: Release stale Unity workspace locks
        shell: powershell
        run: |
          $processNames = @(
            "Unity",
            "UnityShaderCompiler",
            "UnityCrashHandler64",
            "bee_backend",
            "tundra"
          )
          foreach ($processName in $processNames) {
            Get-Process -Name $processName -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2

          $generatedPaths = @(
            (Join-Path $env:GITHUB_WORKSPACE "Library\Bee"),
            (Join-Path $env:GITHUB_WORKSPACE "Temp")
          )
          foreach ($path in $generatedPaths) {
            if (-not (Test-Path -LiteralPath $path)) {
              continue
            }

            $removed = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
                $removed = $true
                break
              } catch {
                Write-Warning "Attempt $attempt could not remove $path: $($_.Exception.Message)"
                Start-Sleep -Seconds (2 * $attempt)
              }
            }

            if (-not $removed -and (Test-Path -LiteralPath $path)) {
              throw "Unable to release generated workspace path: $path"
            }
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          # self-hosted 러너의 이전 branch에서 남은 untracked Assets/build 결과와
          # 취소된 실행이 남긴 Temp/UnityLockfile이 현재 SHA에 섞이지 않게 작업 트리를
          # 먼저 정리한다.
          clean: true

      # 러너의 시스템 전역 실행 정책(Restricted)을 바꾸지 않도록, 이 프로세스에만
      # -ExecutionPolicy Bypass를 적용해 스크립트를 실행한다.
      - name: Run EditMode + PlayMode tests
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\run-unity-tests.ps1" all

      # Performance fixture의 NUnit duration을 artifact quota와 무관하게 Actions 로그에
      # 남긴다. 특정 benchmark가 없는 브랜치에서는 조용히 건너뛴다.
      - name: Print benchmark evidence
        if: success()
        shell: powershell
        run: |
          $xmlFiles = Get-ChildItem -Path TestResults -Filter *.xml -ErrorAction SilentlyContinue
          if (-not $xmlFiles) {
            Write-Host "No Unity test XML files were produced."
            exit 0
          }
          $xpath = "//test-case[" +
            "contains(@fullname,'LargeGridRouteIsDeterministicAndSimulationStaysUnityFree') or " +
            "contains(@fullname,'VehicleSampleCountBenchmarkKeepsSimulationChecksumStable') or " +
            "contains(@fullname,'BenchmarkSceneMeasuresZeroHundredAndFiveHundredViews') or " +
            "contains(@fullname,'OpenSimCity.Tests.EditMode.RoadHierarchyBenchmarkTests.')]"
          foreach ($file in $xmlFiles) {
            [xml]$document = Get-Content -Path $file.FullName
            $cases = $document.SelectNodes($xpath)
            foreach ($case in $cases) {
              Write-Host "BENCHMARK: $($case.fullname) durationSeconds=$($case.duration) result=$($case.result)"
              if ($case.output) { Write-Host $case.output.InnerText }
            }
          }

      # Artifact 저장 quota가 부족해도 NUnit XML의 실패 case와 message를 Actions
      # 로그에서 바로 확인할 수 있게 한다. Compiler error처럼 XML이 없는 경우는 건너뛴다.
      - name: Print failed Unity test cases
        if: failure()
        shell: powershell
        run: |
          $xmlFiles = Get-ChildItem -Path TestResults -Filter *.xml -ErrorAction SilentlyContinue
          if (-not $xmlFiles) {
            Write-Host "No Unity test XML files were produced."
            exit 0
          }
          foreach ($file in $xmlFiles) {
            [xml]$document = Get-Content -Path $file.FullName
            $failed = $document.SelectNodes("//test-case[@result='Failed']")
            Write-Host "::group::$($file.Name) failed cases"
            if (-not $failed -or $failed.Count -eq 0) {
              Write-Host "No failed test cases in this XML."
            } else {
              foreach ($case in $failed) {
                Write-Host "FAILED: $($case.fullname)"
                $message = $case.failure.message
                if ($message) { Write-Host $message.InnerText }
                $stack = $case.failure.'stack-trace'
                if ($stack) { Write-Host $stack.InnerText }
              }
            }
            Write-Host "::endgroup::"
          }

      # Unity batchmode가 compiler error로 조기 종료되면 test XML이 없을 수 있다.
      # artifact quota와 무관하게 원인 줄을 Actions 로그에서 바로 확인할 수 있게 한다.
      - name: Print Unity logs on failure
        if: failure()
        shell: powershell
        run: |
          $logs = Get-ChildItem -Path TestResults -Filter *.log -ErrorAction SilentlyContinue
          if (-not $logs) {
            Write-Host "No Unity log files were produced."
            exit 0
          }
          foreach ($log in $logs) {
            Write-Host "::group::$($log.Name)"
            Get-Content -Path $log.FullName -Tail 500
            Write-Host "::endgroup::"
          }

      # 성공/실패와 무관하게 결과와 Unity 로그를 남긴다. 저장 quota 부족은 테스트
      # 자체의 성공/실패를 덮지 않으며 위 step의 inline output이 최소 진단 경로다.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
