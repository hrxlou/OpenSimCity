name: CI

# 기능 브랜치 push에서 컴파일 오류와 EditMode/PlayMode 테스트를 검증한다.
# main과 태그의 동일 SHA 테스트는 build-windows.yml의 선행 tests job이 담당한다.
#
# Unity Personal 라이선스는 GitHub 호스팅 러너(UNITY_LICENSE Secret) 방식을 더 이상
# 지원하지 않아(Unity가 수동 활성화를 막음), 이미 라이선스가 활성화된 이 저장소 소유자의
# Windows PC를 self-hosted 러너로 등록해 그 위에서 직접 Unity를 실행한다.
# push만 트리거한다. push로 실행된 체크도 커밋 SHA 기준이라 PR 화면에 그대로 표시되므로,
# pull_request 트리거를 함께 두면 같은 커밋을 두 번(그리고 러너가 1대면 순차로) 돌리는 낭비가 된다.
on:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unity tests
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          # self-hosted 러너의 이전 branch에서 남은 untracked Assets/build 결과가
          # 현재 SHA에 섞이지 않게 작업 트리를 먼저 정리한다.
          clean: true

      # checkout 정리와 Library 재사용을 분리한다. Library는 source가 아니며 Unity가
      # 현재 checkout을 기준으로 갱신한다.
      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/*.asset', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ github.ref_name }}-

      # 러너의 시스템 전역 실행 정책(Restricted)을 바꾸지 않도록, 이 프로세스에만
      # -ExecutionPolicy Bypass를 적용해 스크립트를 실행한다.
      - name: Run EditMode + PlayMode tests
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\run-unity-tests.ps1" all

      # 성공/실패와 무관하게 결과와 Unity 로그를 남긴다.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: warn
