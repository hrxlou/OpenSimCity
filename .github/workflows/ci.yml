name: CI

# Unity 실행 장비가 중단된 기간에는 자동 pull_request 실행을 만들지 않는다.
# 로컬 및 self-hosted 실행을 다시 허용할 때 이 파일의 pull_request trigger와
# Unity job을 복원한다. 현재 PR은 정적 검토와 committed fixture만 증거로 남기며
# 실제 장비 항목은 `unverified`로 기록한다.
on:
  workflow_dispatch:

jobs:
  verification-unavailable:
    name: Unity verification unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Record verification policy
        run: |
          echo "Local and self-hosted Unity CI are intentionally disabled."
          echo "Do not treat this workflow as Unity compile or test evidence."
