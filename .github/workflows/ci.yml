name: CI

# main을 대상으로 하는 Pull Request에서만 EditMode/PlayMode 전체 테스트를 실행한다.
#
# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. self-hosted Windows 러너에서 취소된
# Unity/Bee process가 이전 workspace 파일을 계속 잡을 수 있으므로, 각 run은 고유한
# checkout 하위 디렉터리를 사용한다. 이전 run 디렉터리는 best-effort로만 청소한다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unity tests
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 70
    env:
      SOURCE_DIR: source-${{ github.run_id }}
    steps:
      - name: Clean previous isolated checkouts
        continue-on-error: true
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Directory -Filter "source-*" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne $env:SOURCE_DIR } |
            ForEach-Object {
              try {
                Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop
                Write-Host "Removed previous isolated checkout: $($_.FullName)"
              } catch {
                Write-Warning ("Previous checkout remains isolated and will not block this run: {0}" -f $_.FullName)
              }
            }

      - name: Checkout isolated source
        uses: actions/checkout@v7
        with:
          lfs: true
          clean: true
          path: ${{ env.SOURCE_DIR }}

      # 러너의 시스템 전역 실행 정책(Restricted)을 바꾸지 않도록, 이 프로세스에만
      # -ExecutionPolicy Bypass를 적용해 스크립트를 실행한다.
      - name: Run EditMode + PlayMode tests
        shell: cmd
        working-directory: ${{ env.SOURCE_DIR }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "Tools\CI\run-unity-tests.ps1" all

      # Performance fixture의 NUnit duration을 artifact quota와 무관하게 Actions 로그에
      # 남긴다. 특정 benchmark가 없는 브랜치에서는 조용히 건너뛴다.
      - name: Print benchmark evidence
        if: success()
        shell: powershell
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $xmlFiles = Get-ChildItem -Path TestResults -Filter *.xml -ErrorAction SilentlyContinue
          if (-not $xmlFiles) {
            Write-Host "No Unity test XML files were produced."
            exit 0
          }
          $xpath = "//test-case[" +
            "contains(@fullname,'LargeGridRouteIsDeterministicAndSimulationStaysUnityFree') or " +
            "contains(@fullname,'VehicleSampleCountBenchmarkKeepsSimulationChecksumStable') or " +
            "contains(@fullname,'BenchmarkSceneMeasuresZeroHundredAndFiveHundredViews') or " +
            "contains(@fullname,'OpenSimCity.Tests.EditMode.RoadHierarchyBenchmarkTests.')]"
          foreach ($file in $xmlFiles) {
            [xml]$document = Get-Content -Path $file.FullName
            $cases = $document.SelectNodes($xpath)
            foreach ($case in $cases) {
              Write-Host "BENCHMARK: $($case.fullname) durationSeconds=$($case.duration) result=$($case.result)"
              if ($case.output) { Write-Host $case.output.InnerText }
            }
          }

      # Artifact 저장 quota가 부족해도 NUnit XML의 실패 case와 message를 Actions
      # 로그에서 바로 확인할 수 있게 한다. Compiler error처럼 XML이 없는 경우는 건너뛴다.
      - name: Print failed Unity test cases
        if: failure()
        shell: powershell
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $xmlFiles = Get-ChildItem -Path TestResults -Filter *.xml -ErrorAction SilentlyContinue
          if (-not $xmlFiles) {
            Write-Host "No Unity test XML files were produced."
            exit 0
          }
          foreach ($file in $xmlFiles) {
            [xml]$document = Get-Content -Path $file.FullName
            $failed = $document.SelectNodes("//test-case[@result='Failed']")
            Write-Host "::group::$($file.Name) failed cases"
            if (-not $failed -or $failed.Count -eq 0) {
              Write-Host "No failed test cases in this XML."
            } else {
              foreach ($case in $failed) {
                Write-Host "FAILED: $($case.fullname)"
                $message = $case.failure.message
                if ($message) { Write-Host $message.InnerText }
                $stack = $case.failure.'stack-trace'
                if ($stack) { Write-Host $stack.InnerText }
              }
            }
            Write-Host "::endgroup::"
          }

      # Unity batchmode가 compiler error로 조기 종료되면 test XML이 없을 수 있다.
      # artifact quota와 무관하게 원인 줄을 Actions 로그에서 바로 확인할 수 있게 한다.
      - name: Print Unity logs on failure
        if: failure()
        shell: powershell
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $logs = Get-ChildItem -Path TestResults -Filter *.log -ErrorAction SilentlyContinue
          if (-not $logs) {
            Write-Host "No Unity log files were produced."
            exit 0
          }
          foreach ($log in $logs) {
            Write-Host "::group::$($log.Name)"
            Get-Content -Path $log.FullName -Tail 500
            Write-Host "::endgroup::"
          }

      # 성공/실패와 무관하게 결과와 Unity 로그를 남긴다. 저장 quota 부족은 테스트
      # 자체의 성공/실패를 덮지 않으며 위 step의 inline output이 최소 진단 경로다.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unity-test-results-${{ github.run_id }}
          path: ${{ env.SOURCE_DIR }}/TestResults
          if-no-files-found: warn
